<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karşılıklı Adam Asmaca</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
        .container { background: #1e293b; padding: 1.5rem 2rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); width: 100%; max-width: 650px; text-align: center; }
        h1 { margin-bottom: 0.5rem; color: #38bdf8; font-size: 1.8rem; }
        
        /* Skor ve Darağacı Alanı */
        .gallows-arena { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 1rem 0; }
        .player-box { background: #0f172a; padding: 12px; border-radius: 12px; border: 2px solid #334155; display: flex; flex-direction: column; align-items: center; }
        .player-box.my-box { border-color: #166534; }
        .player-box.opp-box { border-color: #7f1d1d; }
        
        .player-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; }
        .my-title { color: #4ade80; }
        .opp-title { color: #f87171; }

        /* SVG Adam Asmaca Çizimi */
        .hangman-svg { width: 120px; height: 140px; stroke: #cbd5e1; stroke-width: 4; stroke-linecap: round; fill: none; }
        .gallows-line { stroke: #64748b; stroke-width: 5; }
        .body-part { stroke: #facc15; stroke-width: 4; display: none; }
        .opp-box .body-part { stroke: #f87171; }
        .dead-eyes { stroke: #ef4444; stroke-width: 2.5; display: none; }

        #status-message { font-size: 1.05rem; margin: 0.8rem 0; padding: 10px; border-radius: 8px; background: #334155; color: #f8fafc; font-weight: 600; }
        .category-badge { display: inline-block; background: #0284c7; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; margin-top: 4px; }

        .word-display { font-size: 1.9rem; letter-spacing: 6px; margin: 1.2rem 0; font-weight: bold; color: #facc15; min-height: 45px; line-height: 1.4; word-wrap: break-word; }

        #menu-section, #custom-input-section, #game-area, #gameover-section { display: none; }
        .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 1rem; }
        .btn { padding: 14px; border-radius: 10px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; color: white; }
        .btn-cat { background: #334155; border: 1px solid #475569; }
        .btn-cat:hover { background: #0284c7; border-color: #38bdf8; }
        .btn-custom { background: #8b5cf6; grid-column: span 2; margin-top: 8px; }
        .btn-custom:hover { background: #7c3aed; }

        .input-group { display: flex; flex-direction: column; gap: 10px; margin-top: 1rem; }
        input[type="text"], input[type="password"] { padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; text-align: center; }

        .keyboard { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-top: 0.8rem; }
        .key-btn { padding: 10px 0; background: #334155; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.1s; }
        .key-btn:hover:not(:disabled) { background: #475569; transform: translateY(-2px); }
        .key-btn.correct { background: #22c55e !important; color: white; cursor: not-allowed; }
        .key-btn.wrong { background: #ef4444 !important; color: white; cursor: not-allowed; }
        .key-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .direct-guess-box { display: flex; gap: 8px; margin-top: 1.2rem; padding-top: 1rem; border-top: 1px solid #334155; }
        .direct-guess-box input { flex: 1; }
        .btn-guess { background: #eab308; color: #0f172a; padding: 0 20px; }
        .btn-guess:hover:not(:disabled) { background: #facc15; }
        .btn-guess:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎯 Adam Asmaca Düellosu</h1>
        <div id="status-message">Sunucuya bağlanılıyor...</div>

        <!-- 1. OYUN MODU VE KATEGORİ SEÇİM MENÜSÜ -->
        <div id="menu-section">
            <p style="color: #94a3b8; margin-bottom: 10px;">Ortak kapışma için bir kategori seçin:</p>
            <div class="cat-grid">
                <button class="btn btn-cat" onclick="selectCategory('Yiyecek')">🍔 Yiyecek</button>
                <button class="btn btn-cat" onclick="selectCategory('İçecek')">🥤 İçecek</button>
                <button class="btn btn-cat" onclick="selectCategory('Marka')">👕 Marka (Giyim)</button>
                <button class="btn btn-cat" onclick="selectCategory('Şehirler')">🏙️ 81 Şehir</button>
                <button class="btn btn-cat" onclick="selectCategory('Hayvanlar')">🦁 Hayvanlar</button>
                <button class="btn btn-cat" onclick="selectCategory('Teknoloji')">💻 Teknoloji</button>
                <button class="btn btn-custom" onclick="initCustomMode()">✍️ Kendi Kelimeni & Kategorini Yaz</button>
            </div>
        </div>

        <!-- 2. KENDİ KELİMENİ YAZMA EKRANI -->
        <div id="custom-input-section">
            <div class="input-group">
                <input type="text" id="customCategoryInput" placeholder="Kategori / İpucu yaz (Örn: Mutfak Eşyası)" autocomplete="off">
                <input type="password" id="customWordInput" placeholder="Gizli Kelimeyi Yaz" autocomplete="off">
                <button class="btn" style="background: #22c55e;" onclick="submitCustomWord()">Başlat!</button>
            </div>
        </div>

        <!-- 3. ORTAK OYUN TAHTASI VE DARAĞAÇLARI -->
        <div id="game-area">
            <div class="gallows-arena">
                <!-- SENİN DARAĞACIN -->
                <div class="player-box my-box">
                    <div class="player-title my-title">SEN (🏆 Skor: <span id="myScore">0</span>)</div>
                    <svg class="hangman-svg" viewBox="0 0 120 140">
                        <!-- Darağacı -->
                        <line class="gallows-line" x1="10" y1="130" x2="90" y2="130" />
                        <line class="gallows-line" x1="30" y1="130" x2="30" y2="10" />
                        <line class="gallows-line" x1="30" y1="10" x2="80" y2="10" />
                        <line class="gallows-line" x1="80" y1="10" x2="80" y2="25" />
                        <!-- Adamın Parçaları (6 Adım) -->
                        <circle class="body-part my-part" cx="80" cy="38" r="13" /> <!-- 1: Kafa -->
                        <line class="body-part my-part" x1="80" y1="51" x2="80" y2="90" /> <!-- 2: Gövde -->
                        <line class="body-part my-part" x1="80" y1="60" x2="60" y2="78" /> <!-- 3: Sol Kol -->
                        <line class="body-part my-part" x1="80" y1="60" x2="100" y2="78" /> <!-- 4: Sağ Kol -->
                        <line class="body-part my-part" x1="80" y1="90" x2="63" y2="115" /> <!-- 5: Sol Bacak -->
                        <line class="body-part my-part" x1="80" y1="90" x2="97" y2="115" /> <!-- 6: Sağ Bacak -->
                        <!-- Ölü Gözler (Can 0 olunca çıkar) -->
                        <g class="dead-eyes" id="my-dead-eyes">
                            <line x1="74" y1="34" x2="78" y2="38" /><line x1="78" y1="34" x2="74" y2="38" />
                            <line x1="82" y1="34" x2="86" y2="38" /><line x1="86" y1="34" x2="82" y2="38" />
                        </g>
                    </svg>
                </div>

                <!-- RAKİBİN DARAĞACI -->
                <div class="player-box opp-box">
                    <div class="player-title opp-title">RAKİP (🏆 Skor: <span id="oppScore">0</span>)</div>
                    <svg class="hangman-svg" viewBox="0 0 120 140">
                        <!-- Darağacı -->
                        <line class="gallows-line" x1="10" y1="130" x2="90" y2="130" />
                        <line class="gallows-line" x1="30" y1="130" x2="30" y2="10" />
                        <line class="gallows-line" x1="30" y1="10" x2="80" y2="10" />
                        <line class="gallows-line" x1="80" y1="10" x2="80" y2="25" />
                        <!-- Adamın Parçaları (6 Adım) -->
                        <circle class="body-part opp-part" cx="80" cy="38" r="13" />
                        <line class="body-part opp-part" x1="80" y1="51" x2="80" y2="90" />
                        <line class="body-part opp-part" x1="80" y1="60" x2="60" y2="78" />
                        <line class="body-part opp-part" x1="80" y1="60" x2="100" y2="78" />
                        <line class="body-part opp-part" x1="80" y1="90" x2="63" y2="115" />
                        <line class="body-part opp-part" x1="80" y1="90" x2="97" y2="115" />
                        <!-- Ölü Gözler -->
                        <g class="dead-eyes" id="opp-dead-eyes">
                            <line x1="74" y1="34" x2="78" y2="38" /><line x1="78" y1="34" x2="74" y2="38" />
                            <line x1="82" y1="34" x2="86" y2="38" /><line x1="86" y1="34" x2="82" y2="38" />
                        </g>
                    </svg>
                </div>
            </div>

            <div>Kategori: <span class="category-badge" id="categoryDisplay">-</span></div>
            
            <div class="word-display" id="wordDisplay">_ _ _ _ _</div>

            <!-- Sanal Klavye -->
            <div class="keyboard" id="keyboard"></div>

            <!-- Direkt Kelime Tahmini -->
            <div class="direct-guess-box">
                <input type="text" id="fullWordInput" placeholder="Kelimeyi direkt tahmin et..." autocomplete="off">
                <button class="btn btn-guess" id="fullWordBtn" onclick="guessFullWord()">Tahmin Et</button>
            </div>
        </div>

        <!-- 4. OYUN SONU EKRANI -->
        <div id="gameover-section" style="margin-top: 1.5rem;">
            <p style="font-size: 1.2rem; margin-bottom: 1rem;">Doğru Kelime: <strong id="revealedWord" style="color: #facc15;"></strong></p>
            <button class="btn" style="background: #0284c7; width: 100%;" onclick="returnToMenu()">🔄 Yeni Kelime / Kategori Seç</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const statusMessage = document.getElementById('status-message');
        const menuSection = document.getElementById('menu-section');
        const customInputSection = document.getElementById('custom-input-section');
        const gameArea = document.getElementById('game-area');
        const gameoverSection = document.getElementById('gameover-section');

        const categoryDisplay = document.getElementById('categoryDisplay');
        const wordDisplay = document.getElementById('wordDisplay');
        const myScore = document.getElementById('myScore');
        const oppScore = document.getElementById('oppScore');
        const keyboard = document.getElementById('keyboard');
        const fullWordInput = document.getElementById('fullWordInput');
        const fullWordBtn = document.getElementById('fullWordBtn');

        const alphabet = "ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZQWX";
        let isMyTurn = false;

        function createKeyboard() {
            keyboard.innerHTML = '';
            alphabet.split('').forEach(letter => {
                const btn = document.createElement('button');
                btn.textContent = letter;
                btn.classList.add('key-btn');
                btn.id = `key-${letter}`;
                btn.addEventListener('click', () => {
                    if (isMyTurn) {
                        socket.emit('guessLetter', letter);
                    }
                });
                keyboard.appendChild(btn);
            });
        }
        createKeyboard();

        // Kalan cana göre adamın uzuvlarını çizen fonksiyon
        function drawHangman(partsClass, eyesId, remainingLives) {
            const mistakes = 6 - remainingLives; // Yapılan hata sayısı (0 ile 6 arası)
            const parts = document.querySelectorAll(`.${partsClass}`);
            parts.forEach((part, index) => {
                part.style.display = index < mistakes ? 'block' : 'none';
            });
            document.getElementById(eyesId).style.display = remainingLives <= 0 ? 'block' : 'none';
        }

        function hideAllSections() {
            menuSection.style.display = 'none';
            customInputSection.style.display = 'none';
            gameArea.style.display = 'none';
            gameoverSection.style.display = 'none';
        }

        socket.on('waiting', (msg) => {
            hideAllSections();
            statusMessage.textContent = msg;
        });

        socket.on('showMenu', (data) => {
            hideAllSections();
            statusMessage.textContent = data.message;
            menuSection.style.display = 'block';
        });

        function selectCategory(cat) {
            socket.emit('startCategoryMode', cat);
        }

        function initCustomMode() {
            socket.emit('initCustomMode');
        }

        socket.on('showCustomInput', (msg) => {
            hideAllSections();
            statusMessage.textContent = msg;
            customInputSection.style.display = 'block';
            document.getElementById('customCategoryInput').value = '';
            document.getElementById('customWordInput').value = '';
        });

        function submitCustomWord() {
            const cat = document.getElementById('customCategoryInput').value;
            const word = document.getElementById('customWordInput').value;
            if (word.trim().length < 2) {
                alert("Kelime en az 2 harfli olmalı kanki!");
                return;
            }
            socket.emit('setCustomWord', { category: cat, word: word });
        }

        socket.on('updateGame', (data) => {
            hideAllSections();
            gameArea.style.display = 'block';

            statusMessage.textContent = data.turnMessage;
            statusMessage.style.background = data.isMyTurn ? "#166534" : "#334155";
            isMyTurn = data.isMyTurn;

            categoryDisplay.textContent = data.category;
            wordDisplay.innerHTML = data.maskedWord.map(ch => ch === ' ' ? '&nbsp;&nbsp;' : ch).join(' ');

            myScore.textContent = data.myScore;
            oppScore.textContent = data.opponentScore;

            // Adam Asmaca Çizimlerini Güncelle
            drawHangman('my-part', 'my-dead-eyes', data.myLives);
            drawHangman('opp-part', 'opp-dead-eyes', data.opponentLives);

            fullWordInput.disabled = !isMyTurn;
            fullWordBtn.disabled = !isMyTurn;

            alphabet.split('').forEach(letter => {
                const btn = document.getElementById(`key-${letter}`);
                btn.classList.remove('correct', 'wrong');

                if (data.correctLetters.includes(letter)) {
                    btn.classList.add('correct');
                    btn.disabled = true;
                } else if (data.wrongLetters.includes(letter)) {
                    btn.classList.add('wrong');
                    btn.disabled = true;
                } else {
                    btn.disabled = !isMyTurn;
                }
            });
        });

        function guessFullWord() {
            const val = fullWordInput.value.trim();
            if (!val) return;
            socket.emit('guessFullWord', val);
            fullWordInput.value = '';
        }

        socket.on('gameOver', (data) => {
            statusMessage.textContent = data.message;
            statusMessage.style.background = "#1e293b";
            document.getElementById('revealedWord').textContent = data.secretWord;
            myScore.textContent = data.myScore;
            oppScore.textContent = data.opponentScore;

            // Eğer can biterek oyun bittiyse son parçayı da çizdirmek için kontrol
            if (data.message.includes("Tüm canların bitti") || data.message.includes("Son canın da gitti")) {
                drawHangman('my-part', 'my-dead-eyes', 0);
            } else if (data.message.includes("Rakibinin tüm canları bitti") || data.message.includes("Rakibin yanlış kelime")) {
                drawHangman('opp-part', 'opp-dead-eyes', 0);
            }

            gameoverSection.style.display = 'block';
            fullWordInput.disabled = true;
            fullWordBtn.disabled = true;

            alphabet.split('').forEach(letter => {
                document.getElementById(`key-${letter}`).disabled = true;
            });
        });

        function returnToMenu() {
            socket.emit('returnToMenu');
        }
    </script>
</body>
</html>
